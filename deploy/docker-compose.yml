# 本地 Compose 参考拓扑（生产请用 deploy/helm/openkv）。
# 镜像：docker build -f deploy/Dockerfile -t openkv:dev .
# Gateway（C++ gateway_node）：docker build -f deploy/Dockerfile.gateway -t openkv-gateway:dev .
version: "3.9"

services:
  meta:
    image: openkv:dev
    environment:
      OPENKV_ROLE: meta
      POD_NAME: meta-0
      OPENKV_NAMESPACE: compose
      OPENKV_META_HEADLESS: meta
      OPENKV_STORAGE_HEADLESS: storage-0
      OPENKV_META_REPLICAS: "1"
      OPENKV_STORAGE_REPLICAS: "1"
      # Compose 无 k8s DNS：覆盖用挂载 conf 更稳；此处演示 entrypoint 角色
    command: ["/opt/openkv/meta_server", "/opt/openkv/conf/bootstrap.conf"]
    volumes:
      - ../conf:/opt/openkv/conf:ro
    ports:
      - "8500:8500"
    networks: [skv]

  storage-0:
    image: openkv:dev
    environment:
      OPENKV_ROLE: storage
    command: ["/opt/openkv/storage_node", "/opt/openkv/conf/storage.conf"]
    volumes:
      - ../conf:/opt/openkv/conf:ro
      - storage0:/data
    networks: [skv]

  gateway:
    image: openkv-gateway:dev
    command:
      - -listen=0.0.0.0:19000
      - -metas=meta:8500
      - -storages=storage-0:9100
    ports:
      - "19000:19000"
    depends_on: [meta, storage-0]
    networks: [skv]

networks:
  skv:

volumes:
  storage0:
