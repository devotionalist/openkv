{{- if .Values.adminToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openkv.fullname" . }}-admin
  namespace: {{ include "openkv.namespace" . }}
  labels:
    {{- include "openkv.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.adminToken | quote }}
{{- end }}
