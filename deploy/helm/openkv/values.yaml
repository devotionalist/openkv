# OpenKV Helm defaults — 3 Meta + 3 Storage HA

nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: openkv

replicaCount:
  meta: 3
  storage: 3
  gateway: 1

image:
  repository: openkv
  tag: "dev"
  pullPolicy: IfNotPresent

gatewayImage:
  repository: openkv-gateway
  tag: "dev"
  pullPolicy: IfNotPresent

ports:
  meta: 8500
  storage: 9100
  gateway: 19000
  gatewayStats: 19001  # HTTP /stats；须 0.0.0.0 监听，拓扑网关线依赖此端口
  web: 19100

cluster:
  shardCount: 8
  replicaFactor: 3
  domain: cluster.local

# Region auto-split（Storage 进程环境变量）
# keys/bytes：任一超阈值即分裂；设 0 关闭该项。默认 ~96MiB / 256k keys。
split:
  keys: "256000"
  bytes: "100663296"  # 96MiB

# 耐久：data=Raft log sync + KV apply 异步（默认）；all=双 sync；none=都不 sync
persistSync: "data"

# Raft BatchSystem workers / Ready group-commit（写路径吞吐）
raftWorkers: "8"
applyWorkers: "8"
readyCoalesceN: "32"   # ≤1 关闭计数触发
readyCoalesceMs: "1"   # 0=仅按条数

persistence:
  enabled: true
  size: 10Gi
  storageClassName: ""

service:
  gateway:
    type: ClusterIP
  web:
    # LoadBalancer: Colima/k3s svclb → host can hit :19100 via lima ssh forward
    type: LoadBalancer

resources: {}

web:
  enabled: true
  image:
    repository: openkv-web
    tag: "dev"
    pullPolicy: IfNotPresent

adminToken: ""

podSecurityContext:
  fsGroup: 0

securityContext: {}
