syntax = "proto3";

package storage.v1;

option go_package = "github.com/devotionalist/openkv/client/go/gen/storage/v1;storagev1";
option cc_enable_arenas = true;

// Compute → Storage 内部 API（仅 Leader 接受写）
service StoreService {
  rpc Get(StoreGetRequest) returns (StoreGetResponse);
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  rpc Scan(StoreScanRequest) returns (StoreScanResponse);
  rpc Ttl(StoreTtlRequest) returns (StoreTtlResponse);
  rpc CheckTxnStatus(StoreCheckTxnRequest) returns (StoreCheckTxnResponse);
  rpc WatchHead(StoreWatchHeadRequest) returns (StoreWatchHeadResponse);
  rpc WatchPoll(StoreWatchPollRequest) returns (StoreWatchPollResponse);
  rpc TransferLeadership(TransferRequest) returns (TransferResponse);
}

// Raft 节点间复制（gRPC）
service RaftService {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc RequestPreVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);
}

// 运维 / Meta 编排（原 ADMIN_* 行协议）
service AdminService {
  rpc EnsureRegion(EnsureRegionRequest) returns (AdminSimpleResponse);
  rpc AddLearner(PeerOpRequest) returns (AdminSimpleResponse);
  rpc Promote(PeerOpRequest) returns (AdminSimpleResponse);
  rpc RemovePeer(PeerOpRequest) returns (AdminSimpleResponse);
  rpc DestroyRegion(DestroyRegionRequest) returns (AdminSimpleResponse);
  rpc PeerProgress(PeerOpRequest) returns (PeerProgressResponse);
  rpc TransferLeader(TransferRequest) returns (AdminSimpleResponse);
  rpc Campaign(CampaignRequest) returns (AdminSimpleResponse);
  rpc PlaceRegion(PlaceRegionRequest) returns (AdminSimpleResponse);
  rpc PrepareSplit(PrepareSplitRequest) returns (AdminSimpleResponse);
  rpc Split(SplitRequest) returns (AdminSimpleResponse);
  rpc Merge(MergeRequest) returns (AdminSimpleResponse);
  rpc SetEpoch(SetEpochRequest) returns (AdminSimpleResponse);
  rpc Checkpoint(CheckpointRequest) returns (AdminSimpleResponse);
  rpc RegionStats(RegionStatsRequest) returns (RegionStatsResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
}

message StatsRequest {}
message StatsResponse {
  uint64 requests = 1;
  uint64 gw = 2;
  uint64 raft = 3;
  uint64 sync = 4;
  uint64 admin = 5;
  uint64 meta_out = 6;
  uint64 client = 7;
  uint64 qdepth = 8;
  uint64 qdrop = 9;
  map<string, uint64> peer_raft = 10;
  map<string, uint64> peer_sync = 11;
  map<string, uint64> peer_raft_out = 12;
  map<string, uint64> peer_sync_out = 13;
  map<string, uint64> meta_out_peers = 14;
}

message StoreGetRequest {
  uint32 shard_id = 1;
  bytes key = 2;
  bool linearizable = 3;
  // 0 = plain KvRecord（RawGet）；>0 = MVCC txn_get(start_ts)
  uint64 start_ts = 4;
}

message StoreGetResponse {
  bytes value = 1;
  bool found = 2;
  uint64 revision = 3;
  bool is_leader = 4;
  string redirect_to = 5;
  bool locked = 6;
  string error = 7;
  bytes lock_primary = 8;  // locked 时阻塞锁的 primary
  uint64 lock_ts = 9;      // locked 时锁的 start_ts
}

message ProposeRequest {
  uint32 shard_id = 1;
  enum Op {
    PUT = 0;
    DELETE = 1;
    ONEPC = 2;
    PREWRITE = 3;
    COMMIT = 4;
    ROLLBACK = 5;
    PESSIMISTIC_LOCK = 6;
    PESSIMISTIC_ROLLBACK = 7;
    RESOLVE_LOCK = 8;  // commit_ts==0 → 回滚清锁
  }
  Op op = 2;
  bytes key = 3;
  bytes value = 4;
  int64 ttl_ms = 5;  // plain Put 相对 TTL；ONEPC/PREWRITE 为绝对 expire_at_ms
  string client_id = 6;
  uint64 request_id = 7;
  bool cas = 8;
  uint64 expected_revision = 9;
  uint64 start_ts = 10;
  uint64 commit_ts = 11;
  bytes primary = 12;
  uint64 epoch = 13;
  uint32 mvcc_op = 14;  // 0=Put 1=Delete
  uint64 for_update_ts = 15;  // PESSIMISTIC_LOCK
  uint64 lock_ttl_ms = 16;    // PESSIMISTIC_LOCK；0 → Storage 默认
}

message StoreScanRequest {
  uint32 shard_id = 1;
  bytes start_key = 2;
  bytes end_key = 3;
  bytes start_after = 4;
  uint64 start_ts = 5;
  uint32 limit = 6;
  bool keys_only = 7;
  bool linearizable = 8;
}

message StoreScanPair {
  bytes key = 1;
  bytes value = 2;
  uint64 revision = 3;
}

message StoreScanResponse {
  repeated StoreScanPair pairs = 1;
  bool truncated = 2;
  bytes next_key = 3;
  bool is_leader = 4;
  string redirect_to = 5;
  string error = 6;
}

message StoreTtlRequest {
  uint32 shard_id = 1;
  bytes key = 2;
  uint64 start_ts = 3;
  bool linearizable = 4;
}

message StoreTtlResponse {
  int64 ttl_ms = 1;  // -2 不存在；-1 永久；>=0 剩余
  bool locked = 2;
  bytes lock_primary = 3;
  uint64 lock_ts = 4;
  bool is_leader = 5;
  string redirect_to = 6;
  string error = 7;
}

message StoreCheckTxnRequest {
  uint32 shard_id = 1;
  bytes primary = 2;
  uint64 lock_ts = 3;
}

message StoreCheckTxnResponse {
  string status = 1;  // locked|committed|rolledback|expired
  uint64 commit_ts = 2;
  bool is_leader = 3;
  string redirect_to = 4;
  string error = 5;
}

message StoreWatchHeadRequest {
  uint32 shard_id = 1;
}

message StoreWatchHeadResponse {
  uint64 revision = 1;
  string redirect_to = 2;  // no_region 等
  string error = 3;
}

message StoreWatchEvent {
  bytes key = 1;
  bytes value = 2;
  uint64 revision = 3;
  bool deleted = 4;
}

message StoreWatchPollRequest {
  uint32 shard_id = 1;
  uint64 since = 2;
  int32 limit = 3;
}

message StoreWatchPollResponse {
  repeated StoreWatchEvent events = 1;
  uint64 max_revision = 2;
  string redirect_to = 3;
  string error = 4;
}

message ProposeResponse {
  bool ok = 1;
  uint64 revision = 2;
  string error = 3;
  string redirect_to = 4;
  bool cas_failed = 5;
  uint64 current_revision = 6;
}

message TransferRequest {
  uint32 shard_id = 1;
  string target_peer = 2;
}

message TransferResponse {
  bool ok = 1;
  string error = 2;
  string redirect_to = 3;
}

// ---- Raft ----

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes data = 3;
}

message AppendEntriesRequest {
  uint32 shard_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated LogEntry entries = 6;
  uint64 leader_commit = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message RequestVoteRequest {
  uint32 shard_id = 1;
  uint64 term = 2;
  string candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message SnapshotChunk {
  uint32 shard_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 last_included_index = 4;
  uint64 last_included_term = 5;
  uint64 offset = 6;
  bytes data = 7;
  bool done = 8;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool ok = 2;
  // 安装成功后的 match（通常 = last_included_index）；与行协议 OK SNAP … match 对齐。
  uint64 match_index = 3;
}

// ---- Admin ----

message RaftPeer {
  string node_id = 1;
  string address = 2;
  bool learner = 3;
}

message AdminSimpleResponse {
  bool ok = 1;
  string message = 2;
  string redirect_to = 3;
}

message EnsureRegionRequest {
  uint32 region_id = 1;
  repeated RaftPeer peers = 2;
}

message PeerOpRequest {
  uint32 region_id = 1;
  string node_id = 2;
  string address = 3;  // AddLearner 需要
}

message DestroyRegionRequest {
  uint32 region_id = 1;
}

message PeerProgressResponse {
  bool ok = 1;
  string message = 2;
  string redirect_to = 3;
  uint64 match_index = 4;
  uint64 commit_index = 5;
  uint64 last_index = 6;
  bool caught_up = 7;
  bool is_learner = 8;
}

message CampaignRequest {
  uint32 region_id = 1;
}

message PlaceRegionRequest {
  uint32 region_id = 1;
  repeated string desired_peers = 2;  // node_id 列表
}

message PrepareSplitRequest {
  uint32 left_region = 1;
  bytes split_key = 2;
}

message SplitRequest {
  uint32 left_region = 1;
  uint32 right_region = 2;
  bytes split_key = 3;
}

message MergeRequest {
  uint32 left_region = 1;
  uint32 right_region = 2;
}

message SetEpochRequest {
  uint32 region_id = 1;
  uint64 epoch = 2;
}

message CheckpointRequest {
  uint32 region_id = 1;
  string path = 2;  // 空则自动路径
}

message RegionStatsRequest {
  uint32 region_id = 1;
}

message RegionStatsResponse {
  bool ok = 1;
  string message = 2;
  uint64 key_count = 3;
  uint64 approx_bytes = 4;
  uint64 epoch = 5;
}

message PingRequest {}

message PingResponse {
  string message = 1;
}
